<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meowquee Stress Test</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 2rem;
        min-height: 100vh;
        font-family: sans-serif;
        background: #111;
        color: #fff;
      }

      h1 {
        margin-top: 0;
      }

      .tests {
        display: grid;
        gap: 1rem;
        max-width: 900px;
        margin: 0 auto;
      }

      .test {
        position: relative;
      }

      .label {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 0.8rem;
        opacity: 0.7;
      }

      .marquee {
        width: 400px;
        max-width: 100%;
        overflow: hidden;
        white-space: nowrap;
        border: 2px solid #555;
        padding: 1rem;
        background: #222;
      }

      .marquee p {
        margin: 0;
        white-space: nowrap;
      }

      .marquee img {
        display: inline-block;
        vertical-align: middle;
      }
    </style>
  </head>

  <body>
    <h1>Meowquee Test Suite thing</h1>
    <p>meow</p>

    <div class="tests">
      <div class="test">
        <div class="marquee meowquee">
          <p>this text moves forever</p><p style="margin-left: 1rem;">|</p>
        </div>
      </div>

      <div class="test">
        <div class="marquee meowquee">
          <p>
            <img src="https://placehold.co/250x100" width="250" height="100" alt="IMG" />
          </p>
        </div>
      </div>
    </div>

    <script type="module">
      import meowquee from './dist/meowquee.mjs';

      const marquees = [];

      document.querySelectorAll('.meowquee').forEach((element, index) => {
        try {
          const marquee = meowquee(element, {
            speed: 70,
            direction: 'left',
            gap: "1rem",
          });

          marquees.push(marquee);

          console.log(`[Meowquee] Test ${String(index + 1).padStart(2, '0')} initialized`, marquee);
        } catch (error) {
          console.error(`[Meowquee] Test ${String(index + 1).padStart(2, '0')} FAILED`, error);
        }
      });

      window.marquees = marquees;
    </script>
  </body>
</html>
